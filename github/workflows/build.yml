name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q -o "NexoraRecorderPro-Phase1"*.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: NexoraRecorderPro
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-debug-apk
          path: NexoraRecorderPro/app/build/outputs/apk/debug/*.apk
